upstream processor {
    zone upstream_processor 64k;
    server processor:8081 resolve;
    keepalive 8;
}

upstream license {
    zone upstream_license 64k;
    server license:8083 resolve;
    keepalive 16;
}

upstream chat {
    zone upstream_chat 64k;
    server chat:8084 resolve;
    keepalive 8;
}
