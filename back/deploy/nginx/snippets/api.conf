location = /api/v1/docs {
    alias /srv/api/docs/index.html;
    default_type text/html;
}

location = /api/v1/docs/openapi.yaml {
    alias /srv/api/openapi.yaml;
    default_type application/yaml;
    add_header Cache-Control "no-cache";
}

location /api/v1/docs/ {
    alias /srv/api/docs/;
    index index.html;
}

location = /api/v1/imports {
    include /etc/nginx/snippets/proxy.conf;
    client_max_body_size 50m;
    proxy_request_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_pass http://processor;
}

location /api/v1/imports/ {
    include /etc/nginx/snippets/proxy.conf;
    limit_req zone=api burst=40 nodelay;
    proxy_pass http://processor;
}

location ~ ^/api/v1/agreements/[^/]+/file$ {
    include /etc/nginx/snippets/proxy.conf;
    client_max_body_size 12m;
    proxy_request_buffering off;
    proxy_pass http://license;
}

location /api/v1/chat/ {
    include /etc/nginx/snippets/proxy.conf;
    limit_req zone=chat burst=10 nodelay;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    proxy_pass http://chat;
}

location ~ ^/api/v1/(me|data|export|dashboard|balance|audit|devices|software|contracts|agreements|compliance|matching)(/|$) {
    include /etc/nginx/snippets/proxy.conf;
    limit_req zone=api burst=40 nodelay;
    proxy_pass http://license;
}

location /api/ {
    default_type application/json;
    return 404 '{"error":{"code":"not_found","message":"route not found","request_id":"$request_id"}}';
}

location = /healthz {
    access_log off;
    default_type application/json;
    return 200 '{"status":"ok"}';
}
