worker_processes auto;

events {
    worker_connections 1024;
}

http {
    log_format json escape=json '{"time":"$time_iso8601","request_id":"$request_id","remote":"$remote_addr",'
                                '"method":"$request_method","uri":"$request_uri","status":$status,'
                                '"bytes":$body_bytes_sent,"duration":$request_time,"upstream":"$upstream_addr"}';
    access_log /dev/stdout json;
    error_log /dev/stderr warn;

    sendfile on;
    server_tokens off;
    keepalive_timeout 65;
    client_max_body_size 1m;

    resolver 127.0.0.11 valid=10s ipv6=off;

    limit_req_zone $binary_remote_addr zone=chat:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    limit_req_status 429;

    map $http_origin $cors_origin {
        default "";
        "~^https?://localhost(:[0-9]+)?$" $http_origin;
        "~^https?://127\.0\.0\.1(:[0-9]+)?$" $http_origin;
    }

    upstream processor {
        zone upstream_processor 64k;
        server processor:8081 resolve;
        keepalive 8;
    }

    upstream license {
        zone upstream_license 64k;
        server license:8083 resolve;
        keepalive 16;
    }

    upstream chat {
        zone upstream_chat 64k;
        server chat:8084 resolve;
        keepalive 8;
    }

    server {
        listen 8080;

        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Expose-Headers "X-Request-Id" always;
        add_header Vary Origin always;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 130s;
        proxy_send_timeout 130s;

        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Request-Id" always;
        add_header Access-Control-Max-Age 600 always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        location = /healthz {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok"}';
        }

        location = /api/v1/imports {
            client_max_body_size 50m;
            proxy_request_buffering off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_pass http://processor;
        }

        location /api/v1/imports/ {
            limit_req zone=api burst=40 nodelay;
            proxy_pass http://processor;
        }

        location = /api/v1/agent/inventory {
            client_max_body_size 10m;
            proxy_pass http://processor;
        }

        location /api/v1/chat/ {
            limit_req zone=chat burst=10 nodelay;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            proxy_pass http://chat;
        }

        location /api/v1/ {
            limit_req zone=api burst=40 nodelay;
            proxy_pass http://license;
        }

        location / {
            default_type application/json;
            return 404 '{"error":{"code":"not_found","message":"route not found"}}';
        }
    }
}
