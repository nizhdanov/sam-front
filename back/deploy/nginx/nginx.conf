worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format json escape=json '{"time":"$time_iso8601","request_id":"$request_id","remote":"$remote_addr",'
                                '"host":"$host","method":"$request_method","uri":"$request_uri","status":$status,'
                                '"bytes":$body_bytes_sent,"duration":$request_time,"upstream":"$upstream_addr"}';
    access_log /dev/stdout json;
    error_log /dev/stderr warn;

    sendfile on;
    tcp_nopush on;
    server_tokens off;
    keepalive_timeout 65;
    client_max_body_size 1m;
    proxy_connect_timeout 5s;
    proxy_read_timeout 130s;
    proxy_send_timeout 130s;

    gzip on;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;
    gzip_min_length 1024;

    resolver 127.0.0.11 valid=10s ipv6=off;

    limit_req_zone $binary_remote_addr zone=chat:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    limit_req_status 429;

    include /etc/nginx/snippets/upstreams.conf;
    include /etc/nginx/conf.d/*.conf;
}
