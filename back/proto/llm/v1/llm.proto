syntax = "proto3";

package llm.v1;

option go_package = "sam/gen/go/llm/v1;llmv1";

service LLMService {
  rpc MatchSoftware(MatchSoftwareRequest) returns (MatchSoftwareResponse);
  rpc Chat(ChatRequest) returns (stream ChatResponse);
  rpc AnalyzeAgreement(AnalyzeAgreementRequest) returns (AnalyzeAgreementResponse);
}

message SoftwareCandidate {
  string id = 1;
  string name = 2;
  string publisher = 3;
  string edition = 4;
}

message MatchSoftwareRequest {
  string display_name = 1;
  string publisher = 2;
  string version = 3;
  repeated SoftwareCandidate candidates = 4;
}

message MatchSoftwareResponse {
  string status = 1;
  string product_id = 2;
  double confidence = 3;
  string reason = 4;
  string model = 5;
}

message ChatMessage {
  string role = 1;
  string content = 2;
}

message ChatRequest {
  string conversation_id = 1;
  repeated ChatMessage history = 2;
  string message = 3;
}

message ChatResponse {
  oneof event {
    string delta = 1;
    ChatDone done = 2;
    string error = 3;
  }
}

message ChatDone {
  string model = 1;
  int32 prompt_tokens = 2;
  int32 completion_tokens = 3;
}

message AnalyzeAgreementRequest {
  string agreement_id = 1;
  string agreement_text = 2;
}

message AnalyzeAgreementResponse {
  bytes analysis_json = 1;
  string model = 2;
  string prompt_version = 3;
}

