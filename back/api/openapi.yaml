openapi: 3.1.0
info:
  title: SAM Platform API
  version: 2.0.0
  description: |
    REST API системы управления программными активами (SAM). Все ручки, кроме health, требуют
    `Authorization: Bearer <JWT>`; токены выдаёт внешний IdP.

    Роли:
    - **ADMIN** — администратор SAM: полный доступ ко всем разделам.
    - **USER** — обычный пользователь: справочник бесплатного ПО (БПО), запрещённое ПО,
      данные своего компьютера (claim `device_serial` в JWT) и чат по бесплатному ПО.

    Данные об установленном ПО приходят только из CSV-выгрузок агента; учёт ведётся по устройствам.
    Цены не ведутся.

    401 — нет или невалиден JWT, 403 — недостаточно прав, чужие объекты для USER скрываются ответом 404.
    Ошибки: `{"error":{"code","message","request_id"}}`. Списки: `items` + `pagination`
    (page с 1, limit по умолчанию 50, максимум 200).

    В Swagger нажмите Authorize и вставьте JWT без префикса Bearer.
servers:
  - url: /
security:
  - bearer: []

tags:
  - name: imports
    description: "US-08. Загрузка CSV-выгрузки агента: предпросмотр, подтверждение, отчёт."
  - name: data
    description: "US-09, US-11, US-12, US-13, US-22. Универсальные таблицы, фильтры, группировки и экспорт CSV/XLSX."
  - name: devices
    description: "US-07, US-22. Реестр устройств по серийным номерам."
  - name: software
    description: "US-02, US-03. Единый каталог ПО."
  - name: agreements
    description: "US-04, US-16, US-17. Справочник лицензионных соглашений и AI-анализ."
  - name: contracts
    description: "US-11. Реестр договоров закупки (купленные места)."
  - name: compliance
    description: "US-10, US-11, US-12. KPI, баланс «куплено vs установлено», нарушения."
  - name: matching
    description: "US-14, US-15. Очередь нераспознанного ПО, правила соответствия, пороги."
  - name: audit
    description: "US-20. Журнал изменений."
  - name: chat
    description: "US-18, US-19, US-21. AI-ассистент с ответами в Markdown через SSE."

paths:
  /api/v1/imports:
    post:
      tags: [imports]
      summary: Загрузить CSV-выгрузку
      description: |
        Сохраняет файл и возвращает предпросмотр первых 20 строк (`preview`): разделитель, колонки, значения,
        пометки `excluded` (KB-обновления и системные компоненты — рантаймы, драйверы, языковые пакеты; не попадут в учёт) и `error`. Импорт остаётся в статусе
        `AWAITING_CONFIRMATION`, пока не вызван `POST /imports/{id}/confirm`. С `confirm=true` обработка стартует сразу.
        Ошибка заголовков (нет обязательных колонок) возвращается сразу ответом 400.

        Колонки: `COMPUTERS.SERIAL_NUMBER`, `SOFTWARE.DISPLAYNAME` (обязательные), `SOFTWARE.PUBLISHER`, `SOFTWARE.VERSION`;
        разделитель `,` или `;`, UTF-8, до 50 МБ. Дубли — по связке «устройство + имя ПО + версия».

        Доступ: ADMIN.
      parameters:
        - { name: confirm, in: query, schema: { type: boolean, default: false } }
        - { name: collected_at, in: query, description: "Дата выгрузки; по умолчанию — момент загрузки", schema: { type: string, format: date-time } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "202":
          description: Файл принят
          content:
            application/json:
              schema:
                type: object
                properties:
                  import_id: { type: string, format: uuid }
                  status: { type: string, enum: [AWAITING_CONFIRMATION, PENDING] }
                  filename: { type: string }
                  preview: { $ref: "#/components/schemas/ImportPreview" }
        "400": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
    get:
      tags: [imports]
      summary: История импортов
      description: "Доступ: ADMIN."
      parameters: [{ $ref: "#/components/parameters/Page" }, { $ref: "#/components/parameters/Limit" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Import" } }
                  pagination: { $ref: "#/components/schemas/Pagination" }
  /api/v1/imports/{id}:
    get:
      tags: [imports]
      summary: Статус и отчёт импорта
      description: "Отчёт: `loaded_rows` загружено, `duplicate_rows` дублей, `excluded_rows` KB-обновлений, `error_rows` ошибок. Доступ: ADMIN."
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Import" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/imports/{id}/preview:
    get:
      tags: [imports]
      summary: Предпросмотр первых строк
      description: "Доступ: ADMIN."
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ImportPreview" } } } }
  /api/v1/imports/{id}/confirm:
    post:
      tags: [imports]
      summary: Подтвердить и запустить обработку
      description: "Только для статуса AWAITING_CONFIRMATION, иначе 409. Доступ: ADMIN."
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Import" } } } }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/imports/{id}/cancel:
    post:
      tags: [imports]
      summary: Отменить неподтверждённый импорт
      description: "Удаляет сохранённый файл, статус CANCELLED. Доступ: ADMIN."
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Import" } } } }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/imports/{id}/errors:
    get:
      tags: [imports]
      summary: Ошибки строк
      description: "Доступ: ADMIN."
      parameters: [{ $ref: "#/components/parameters/ID" }, { $ref: "#/components/parameters/Page" }, { $ref: "#/components/parameters/Limit" }]
      responses:
        "200": { $ref: "#/components/responses/Page" }
  /api/v1/imports/{id}/retry:
    post:
      tags: [imports]
      summary: Повторить обработку
      description: "Повторно публикует неуспешные снимки. Доступ: ADMIN."
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "202": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Import" } } } }

  /api/v1/data/{dataset}:
    get:
      tags: [data]
      summary: Универсальная таблица с фильтрами, группировкой и экспортом
      description: |
        Любой query-параметр, кроме `group_by`, `limit`, `format`, — фильтр. Текстовые фильтры ищут по подстроке,
        статусы — точное значение, `recognized`/`in_bpo` — true/false, `*_id` — UUID.

        | dataset | колонки | фильтры | group_by |
        | --- | --- | --- | --- |
        | installations | product_id, device_id, serial_number, device_type, raw_name, product, publisher, version, current_version, match_status, status, license_type, cost_model, first_seen_at, last_seen_at, license_status* | product, product_id, raw_name, publisher, version, serial_number, device_type, match_status, recognized, status, license_type, cost_model, in_bpo | product, publisher, version, serial_number, device_type, match_status, status, license_type, cost_model |
        | devices | device_id, serial_number, device_type, status, hostname, responsible, location, last_inventory_at, installations, open_findings | serial_number, hostname, responsible, location, device_type, status | device_type, status, location |
        | products | product_id, product, publisher, current_version, section, class, in_bpo, status, status_comment, license_type, cost_model, purchased*, devices*, license_status* | product, product_id, publisher, section, class, status, license_type, cost_model, in_bpo | publisher, section, class, status, license_type, cost_model, in_bpo |
        | contracts* | contract_id, product_id, product, contract_number, metric, quantity, valid_from, expires_at, status (ACTIVE, EXPIRING, EXPIRED, INACTIVE, NOT_STARTED) | product, product_id, contract_number, metric, status | product, metric, status |
        | findings | finding_id, product_id, device_id, finding_type, severity, status, serial_number, raw_name, product, version, current_version, detected_at, comment | finding_type, severity, status, serial_number, product, product_id | finding_type, severity, status, serial_number, product |

        `*` — только ADMIN. `license_status`: COVERED, DEFICIT n, UNVERIFIED, UNSUPPORTED_METRIC, NOT_REQUIRED, UNMATCHED.
        С `group_by` возвращаются пары «значение — количество» (для installations — число устройств, для contracts — сумма мест).

        USER: installations, devices и findings — только своё устройство; products — только БПО, бесплатное и запрещённое ПО; contracts — 403.

        Примеры: реестр установок по продукту (US-09, раскрытие строки US-11) — `installations?product_id=…`;
        не распознано — `installations?recognized=false`; запрещённое ПО (US-12) — `findings?finding_type=FORBIDDEN_SOFTWARE`;
        устаревшие версии — `findings?finding_type=OUTDATED_SOFTWARE`; истекающие подписки — `contracts?status=EXPIRING`;
        экспорт (US-13) — добавьте `format=xlsx` или `format=csv` (до 10 000 строк).
      parameters:
        - { name: dataset, in: path, required: true, schema: { type: string, enum: [installations, devices, products, contracts, findings] } }
        - { name: group_by, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, default: 100 } }
        - { name: format, in: query, schema: { type: string, enum: [json, csv, xlsx], default: json } }
        - { name: product, in: query, schema: { type: string } }
        - { name: product_id, in: query, schema: { type: string, format: uuid } }
        - { name: serial_number, in: query, schema: { type: string } }
        - { name: recognized, in: query, schema: { type: boolean } }
        - { name: status, in: query, schema: { type: string } }
        - { name: finding_type, in: query, schema: { $ref: "#/components/schemas/FindingType" } }
      responses:
        "200":
          description: Таблица или файл
          content:
            application/json: { schema: { $ref: "#/components/schemas/DataTable" } }
            text/csv: { schema: { type: string } }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: { schema: { type: string, format: binary } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/export:
    post:
      tags: [data]
      summary: Выгрузить произвольную таблицу (например, из ответа чата)
      description: "US-19. Принимает колонки и строки, возвращает XLSX или CSV. Доступ: ADMIN, USER."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [columns, rows]
              properties:
                title: { type: string }
                format: { type: string, enum: [xlsx, csv] }
                columns: { type: array, items: { type: string } }
                rows: { type: array, items: { type: array, items: {} } }
      responses:
        "200":
          description: Файл
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: { schema: { type: string, format: binary } }
            text/csv: { schema: { type: string } }

  /api/v1/me/device:
    get:
      tags: [devices]
      summary: Мой компьютер
      description: "US-22. Устройство из claim `device_serial`. Доступ: USER, ADMIN (если claim задан)."
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/DeviceCard" } } } }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/devices/{id}:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      tags: [devices]
      summary: Карточка устройства
      description: "US-07. Тип, статус, ручные поля, счётчики и история импортов. Список установленного ПО — `/data/installations?serial_number=`. USER видит только своё устройство."
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/DeviceCard" } } } }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: [devices]
      summary: Изменить устройство
      description: "Тип, статус (NEW → ACTIVE), ручные поля «ответственный» и «подразделение/кабинет» (в расчётах не участвуют). Доступ: ADMIN."
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                device_type: { type: string, enum: [PHYSICAL, VIRTUAL] }
                status: { type: string, enum: [NEW, ACTIVE] }
                hostname: { type: [string, "null"] }
                responsible: { type: [string, "null"] }
                location: { type: [string, "null"] }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/DeviceCard" } } } }

  /api/v1/software:
    get:
      tags: [software]
      summary: Каталог ПО
      description: "US-02. ADMIN видит весь каталог; USER — только БПО, бесплатное и запрещённое ПО без служебных полей."
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - { name: search, in: query, schema: { type: string } }
        - { name: section, in: query, schema: { type: string } }
        - { name: class, in: query, schema: { type: string } }
        - { name: license_type, in: query, schema: { $ref: "#/components/schemas/LicenseType" } }
        - { name: cost_model, in: query, schema: { $ref: "#/components/schemas/CostModel" } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/ProductStatus" } }
        - { name: in_bpo, in: query, schema: { type: boolean } }
        - { name: include_archived, in: query, schema: { type: boolean } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Product" } }
                  pagination: { $ref: "#/components/schemas/Pagination" }
    post:
      tags: [software]
      summary: Создать продукт
      description: "US-03. Статус FORBIDDEN требует `status_comment`. Дубль (название + издатель + редакция) — 409. Доступ: ADMIN."
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ProductInput" } } } }
      responses:
        "201": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Product" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/software/{id}:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      tags: [software]
      summary: Карточка продукта
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Product" } } } }
    patch:
      tags: [software]
      summary: Изменить продукт
      description: "Частичное обновление; `archived: true` архивирует. Перевод в FORBIDDEN требует комментария. Пересчитывает нарушения. Доступ: ADMIN."
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/ProductInput"
                - type: object
                  properties:
                    archived: { type: boolean }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Product" } } } }
    delete:
      tags: [software]
      summary: Удалить продукт
      description: "Блокируется (409), если есть установки или договоры — тогда архивируйте. Доступ: ADMIN."
      responses:
        "204": { description: Удалено }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/software/{id}/versions:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      tags: [software]
      summary: Версии продукта
      responses:
        "200": { $ref: "#/components/responses/List" }
    post:
      tags: [software]
      summary: Добавить версию
      description: "Доступ: ADMIN."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: string }
                lifecycle_status: { type: string, enum: [CURRENT, OUTDATED, UNSUPPORTED, UNKNOWN] }
                release_date: { type: string, format: date }
                end_of_support: { type: string, format: date }
      responses:
        "201": { $ref: "#/components/responses/Object" }
  /api/v1/software/{id}/versions/{versionID}:
    patch:
      tags: [software]
      summary: Изменить статус версии
      description: "Доступ: ADMIN."
      parameters:
        - $ref: "#/components/parameters/ID"
        - { name: versionID, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                lifecycle_status: { type: string, enum: [CURRENT, OUTDATED, UNSUPPORTED, UNKNOWN] }
      responses:
        "200": { $ref: "#/components/responses/Object" }

  /api/v1/agreements:
    get:
      tags: [agreements]
      summary: Справочник лицензионных соглашений
      description: "US-04. В списке `products_count` — сколько продуктов ссылается на соглашение. Доступ: ADMIN."
      parameters: [{ $ref: "#/components/parameters/Page" }, { $ref: "#/components/parameters/Limit" }]
      responses:
        "200": { $ref: "#/components/responses/Page" }
    post:
      tags: [agreements]
      summary: Добавить соглашение
      description: "Доступ: ADMIN."
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AgreementInput" } } } }
      responses:
        "201": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Agreement" } } } }
  /api/v1/agreements/{id}:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      tags: [agreements]
      summary: Соглашение с текстом
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Agreement" } } } }
    patch:
      tags: [agreements]
      summary: Изменить соглашение
      description: "Пересчитывает нарушения продуктов соглашения. Доступ: ADMIN."
      requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/AgreementInput" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Agreement" } } } }
    delete:
      tags: [agreements]
      summary: Удалить соглашение
      description: "Запрещено (409), пока на соглашение ссылаются продукты. Доступ: ADMIN."
      responses:
        "204": { description: Удалено }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/agreements/{id}/file:
    post:
      tags: [agreements]
      summary: Загрузить текст соглашения файлом
      description: "US-16. .txt, .pdf или .docx до 10 МБ; текст извлекается и сохраняется в соглашение. Доступ: ADMIN."
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Agreement" } } } }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/agreements/{id}/analyze:
    post:
      tags: [agreements]
      summary: AI-разбор соглашения
      description: |
        US-16, US-17. Текст разбивается на нумерованные абзацы; результат содержит тип лицензии, модель оплаты,
        «коммерческое использование: YES/NO/UNDEFINED», скрытые подписки и автопродления, ограничения и риски —
        каждый пункт со ссылками `paragraphs` на абзацы из массива `paragraphs` ответа (нумерация с 1).
        `similar_agreements` — топ-3 похожих соглашений из справочника. Кэш по хэшу текста; `force=true` — заново.
        Доступ: ADMIN.
      parameters:
        - $ref: "#/components/parameters/ID"
        - { name: force, in: query, schema: { type: boolean } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Analysis" } } } }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/agreements/{id}/analysis:
    get:
      tags: [agreements]
      summary: Последний разбор
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Analysis" } } } }
  /api/v1/agreements/{id}/analysis/approve:
    post:
      tags: [agreements]
      summary: Сохранить разбор в соглашение
      description: "Кнопка «Сохранить в лицензию»: записывает предложенные license_type, cost_model и commercial_allowed. Доступ: ADMIN."
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Analysis" } } } }
  /api/v1/agreements/{id}/similar:
    get:
      tags: [agreements]
      summary: Топ-3 похожих стандартных соглашения
      description: "US-17. Сходство текста (pg_trgm, 0..1). Доступ: ADMIN."
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200": { $ref: "#/components/responses/Object" }

  /api/v1/contracts:
    get:
      tags: [contracts]
      summary: Договоры закупки
      description: "Доступ: ADMIN."
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - { name: product_id, in: query, schema: { type: string, format: uuid } }
        - { name: active, in: query, schema: { type: boolean } }
        - { name: expiring_within_days, in: query, schema: { type: integer } }
      responses:
        "200": { $ref: "#/components/responses/Page" }
    post:
      tags: [contracts]
      summary: Добавить договор
      description: "Количество мест по продукту; метрика по умолчанию PER_DEVICE. Пересчитывает баланс. Доступ: ADMIN."
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ContractInput" } } } }
      responses:
        "201": { $ref: "#/components/responses/Object" }
  /api/v1/contracts/{id}:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      tags: [contracts]
      summary: Договор
      responses:
        "200": { $ref: "#/components/responses/Object" }
    patch:
      tags: [contracts]
      summary: Изменить договор
      description: "Доступ: ADMIN."
      requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/ContractInput" } } } }
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /api/v1/contracts/{id}/deactivate:
    post:
      tags: [contracts]
      summary: Исключить договор из расчёта
      description: "Доступ: ADMIN."
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200": { $ref: "#/components/responses/Object" }

  /api/v1/dashboard:
    get:
      tags: [compliance]
      summary: KPI парка
      description: |
        US-10. Устройства, установки, % распознанного ПО, дефицит (недолицензирование), простаивающие лицензии
        (куплено > установлено), запрещённое и устаревшее ПО, истекающие договоры (в пределах `expiring_within_days`).
        Детализация по клику: `/data/findings?finding_type=…`, `/balance`, `/data/contracts?status=EXPIRING`,
        `/data/installations?recognized=false`, `/matching/pending`. Доступ: ADMIN.
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Dashboard" } } } }
  /api/v1/balance:
    get:
      tags: [compliance]
      summary: Куплено vs установлено
      description: |
        US-11. `view=commercial` — продукты с платными лицензиями: purchased (сумма мест действующих договоров),
        consumed (установлено), deficit (штрафной риск), available (простаивает).
        `view=free` — бесплатное ПО и БПО: статус, актуальная версия, число устройств и устройств с устаревшей версией.
        Раскрытие строки — `/data/installations?product_id=…`. Доступ: ADMIN.
      parameters:
        - { name: view, in: query, schema: { type: string, enum: [commercial, free], default: commercial } }
        - { name: product_id, in: query, schema: { type: string, format: uuid } }
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /api/v1/compliance/findings:
    get:
      tags: [compliance]
      summary: Нарушения
      description: "US-12, US-22. USER видит только нарушения своего устройства (запрещённое, устаревшее ПО)."
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - { name: type, in: query, description: "Типы через запятую", schema: { type: string } }
        - { name: severity, in: query, schema: { type: string, enum: [LOW, MEDIUM, HIGH, CRITICAL] } }
        - { name: status, in: query, schema: { type: string, enum: [OPEN, ACKNOWLEDGED, RESOLVED] } }
        - { name: serial_number, in: query, schema: { type: string } }
        - { name: product_id, in: query, schema: { type: string, format: uuid } }
      responses:
        "200": { $ref: "#/components/responses/Page" }
  /api/v1/compliance/findings/{id}/acknowledge:
    post:
      tags: [compliance]
      summary: Отметить «обработано»
      description: "Комментарий обязателен; фиксируются автор и время. Доступ: ADMIN."
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [comment]
              properties:
                comment: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Object" }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/compliance/summary:
    get:
      tags: [compliance]
      summary: Сводка нарушений по типам и критичности
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /api/v1/compliance/recalculate:
    post:
      tags: [compliance]
      summary: Пересчитать нарушения
      description: "Доступ: ADMIN."
      responses:
        "200": { $ref: "#/components/responses/Object" }

  /api/v1/matching/pending:
    get:
      tags: [matching]
      summary: Очередь нераспознанных имён
      description: "US-14. Сырое имя, издатель, версия, предложенный продукт, confidence, кандидаты. Доступ: ADMIN."
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - { name: status, in: query, schema: { type: string, enum: [PENDING, APPROVED, REJECTED], default: PENDING } }
      responses:
        "200": { $ref: "#/components/responses/Page" }
  /api/v1/matching/rematch:
    post:
      tags: [matching]
      summary: Пересопоставить очередь по актуальному каталогу
      description: "Фоново прогоняет все PENDING-задачи через правила, точные и fuzzy-совпадения; системные компоненты (рантаймы, драйверы, языковые пакеты) снимает как «не ПО». Итог — в журнале (`entity=matching`, action REMATCH). Доступ: ADMIN."
      responses:
        "202": { $ref: "#/components/responses/Object" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/matching/{id}/approve:
    post:
      tags: [matching]
      summary: Принять или выбрать другой продукт
      description: "Создаёт правило соответствия и пересчитывает комплаенс без повторного импорта. Доступ: ADMIN."
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product_id]
              properties:
                product_id: { type: string, format: uuid }
                version_id: { type: string, format: uuid }
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /api/v1/matching/{id}/reject:
    post:
      tags: [matching]
      summary: Отклонить
      description: "Доступ: ADMIN."
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /api/v1/matching/rules:
    get:
      tags: [matching]
      summary: Правила соответствия «сырое имя → продукт»
      description: "US-15. Применяются автоматически к новым выгрузкам. Доступ: ADMIN."
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - { name: search, in: query, schema: { type: string } }
        - { name: product_id, in: query, schema: { type: string, format: uuid } }
      responses:
        "200": { $ref: "#/components/responses/Page" }
    post:
      tags: [matching]
      summary: Создать правило
      description: "Доступ: ADMIN."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [raw_name, product_id]
              properties:
                raw_name: { type: string }
                raw_publisher: { type: string }
                raw_version: { type: string }
                product_id: { type: string, format: uuid }
                version_id: { type: string, format: uuid }
      responses:
        "201": { $ref: "#/components/responses/Object" }
  /api/v1/matching/rules/{id}:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    patch:
      tags: [matching]
      summary: Перепривязать правило к другому продукту
      description: "Доступ: ADMIN."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product_id]
              properties:
                product_id: { type: string, format: uuid }
                version_id: { type: string, format: uuid }
      responses:
        "200": { $ref: "#/components/responses/Object" }
    delete:
      tags: [matching]
      summary: Удалить правило
      description: "Установки по правилу уходят на повторную проверку. Доступ: ADMIN."
      responses:
        "204": { description: Удалено }
  /api/v1/matching/settings:
    get:
      tags: [matching]
      summary: Пороги автоприменения
      description: "Доступ: ADMIN."
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/MatchingSettings" } } } }
    put:
      tags: [matching]
      summary: Изменить пороги
      description: "`auto_apply_confidence` — минимальная уверенность ИИ для автоприменения; `fuzzy_auto_threshold` — сходство для автоматического fuzzy-сопоставления. Значения в (0, 1]. Доступ: ADMIN."
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/MatchingSettings" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/MatchingSettings" } } } }

  /api/v1/audit:
    get:
      tags: [audit]
      summary: Журнал изменений
      description: "US-20. Дата, пользователь, объект, действие, краткое описание и изменения. Объекты: product, version, agreement, contract, device, rule, matching, finding, settings. Доступ: ADMIN."
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - { name: actor, in: query, schema: { type: string } }
        - { name: entity, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        "200": { $ref: "#/components/responses/Page" }

  /api/v1/chat/suggestions:
    get:
      tags: [chat]
      summary: Типовые вопросы для роли
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /api/v1/chat/conversations:
    get:
      tags: [chat]
      summary: История диалогов
      parameters: [{ $ref: "#/components/parameters/Page" }, { $ref: "#/components/parameters/Limit" }]
      responses:
        "200": { $ref: "#/components/responses/Page" }
    post:
      tags: [chat]
      summary: Новый диалог
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
      responses:
        "201": { $ref: "#/components/responses/Object" }
  /api/v1/chat/conversations/{id}:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      tags: [chat]
      summary: Диалог
      responses:
        "200": { $ref: "#/components/responses/Object" }
    delete:
      tags: [chat]
      summary: Удалить диалог
      responses:
        "204": { description: Удалено }
  /api/v1/chat/conversations/{id}/messages:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      tags: [chat]
      summary: Сообщения диалога
      parameters: [{ $ref: "#/components/parameters/Page" }, { $ref: "#/components/parameters/Limit" }]
      responses:
        "200": { $ref: "#/components/responses/Page" }
    post:
      tags: [chat]
      summary: Задать вопрос (ответ через SSE)
      description: |
        US-18, US-21. Ответ стримится событиями `message_start` `{message_id}`, `delta` `{content}`,
        `message_end` `{message_id, status}`, `error` `{code, message}`. Текст — Markdown: вывод, таблица, итог.
        Объекты в таблицах — ссылки `sam://device/<device_id>`, `sam://product/<product_id>`, `sam://contract/<contract_id>`.
        USER получает ответы только по бесплатному ПО, запрещённому ПО и своему компьютеру.
        Один активный запрос на пользователя (иначе 429).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string, maxLength: 4000 }
      responses:
        "200": { description: SSE, content: { text/event-stream: { schema: { type: string } } } }
        "429": { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }

  parameters:
    ID: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }

  responses:
    Object: { description: OK, content: { application/json: { schema: { type: object } } } }
    List: { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { type: object } } } } } } }
    Page: { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Page" } } } }
    Error: { description: Ошибка, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            request_id: { type: string }
    Pagination:
      type: object
      properties:
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
        total_pages: { type: integer }
    Page:
      type: object
      properties:
        items: { type: array, items: { type: object } }
        pagination: { $ref: "#/components/schemas/Pagination" }
    ProductStatus: { type: string, enum: [ACTUAL, OUTDATED, FORBIDDEN] }
    LicenseType: { type: string, enum: [OPEN_SOURCE, COMMERCIAL, TRIAL] }
    CostModel: { type: string, enum: [FREE, PAID, SHAREWARE], description: "бесплатно / платно / условно-бесплатно" }
    FindingType:
      type: string
      enum: [FORBIDDEN_SOFTWARE, OUTDATED_SOFTWARE, UNSUPPORTED_SOFTWARE, UNKNOWN_SOFTWARE, LICENSE_DEFICIT, LICENSE_EXPIRED, LICENSE_UNVERIFIED, COMMERCIAL_USE_RESTRICTED]
    Import:
      type: object
      properties:
        id: { type: string, format: uuid }
        filename: { type: string }
        status: { type: string, enum: [AWAITING_CONFIRMATION, PENDING, PARSING, PROCESSING, COMPLETED, COMPLETED_WITH_ERRORS, FAILED, CANCELLED] }
        file_size: { type: integer }
        total_rows: { type: integer }
        loaded_rows: { type: integer }
        duplicate_rows: { type: integer }
        excluded_rows: { type: integer }
        error_rows: { type: integer }
        total_devices: { type: integer }
        processed_devices: { type: integer }
        failed_devices: { type: integer }
        pending_devices: { type: integer }
        progress_percent: { type: number }
        created_by: { type: string }
        collected_at: { type: string, format: date-time }
        error_message: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        completed_at: { type: [string, "null"], format: date-time }
    ImportPreview:
      type: object
      properties:
        delimiter: { type: string }
        columns: { type: array, items: { type: string } }
        rows:
          type: array
          items:
            type: object
            properties:
              row: { type: integer }
              serial_number: { type: string }
              display_name: { type: string }
              publisher: { type: string }
              version: { type: string }
              excluded: { type: boolean, description: "KB-обновление, не попадёт в учёт" }
              error: { type: string }
    DataTable:
      type: object
      properties:
        dataset: { type: string }
        group_by: { type: string }
        columns: { type: array, items: { type: string } }
        rows: { type: array, items: { type: array, items: {} } }
        total: { type: integer }
        shown: { type: integer }
    DeviceCard:
      type: object
      properties:
        id: { type: string, format: uuid }
        serial_number: { type: string }
        device_type: { type: string, enum: [PHYSICAL, VIRTUAL] }
        status: { type: string, enum: [NEW, ACTIVE], description: "NEW — новое из выгрузки" }
        hostname: { type: [string, "null"] }
        operating_system: { type: [string, "null"] }
        responsible: { type: [string, "null"] }
        location: { type: [string, "null"] }
        last_inventory_at: { type: [string, "null"], format: date-time }
        installations_count: { type: integer }
        open_findings_count: { type: integer }
        imports:
          type: array
          items:
            type: object
            properties:
              inventory_id: { type: string, format: uuid }
              collected_at: { type: string, format: date-time }
              result: { type: string, enum: [APPLIED, ALREADY_PROCESSED, SUPERSEDED] }
              processed_at: { type: string, format: date-time }
    ProductInput:
      type: object
      properties:
        canonical_name: { type: string }
        publisher: { type: string }
        edition: { type: string }
        purpose: { type: string }
        section: { type: string, description: "раздел классификатора" }
        class: { type: string, description: "класс классификатора" }
        in_bpo: { type: boolean, description: "входит в перечень БПО" }
        current_version: { type: [string, "null"], description: "актуальная версия; установки ниже неё — устаревшие" }
        agreement_id: { type: [string, "null"], format: uuid }
        status: { $ref: "#/components/schemas/ProductStatus" }
        status_comment: { type: string, description: "обязателен для FORBIDDEN" }
    Product:
      allOf:
        - $ref: "#/components/schemas/ProductInput"
        - type: object
          properties:
            id: { type: string, format: uuid }
            agreement_name: { type: [string, "null"] }
            license_type: { $ref: "#/components/schemas/LicenseType" }
            cost_model: { $ref: "#/components/schemas/CostModel" }
            purchased_seats: { type: integer, description: "мест по действующим договорам" }
            active_installations: { type: integer }
            devices: { type: integer }
            archived_at: { type: [string, "null"], format: date-time }
    AgreementInput:
      type: object
      properties:
        name: { type: string }
        license_type: { $ref: "#/components/schemas/LicenseType" }
        cost_model: { $ref: "#/components/schemas/CostModel" }
        agreement_text: { type: [string, "null"] }
        source_url: { type: [string, "null"] }
        commercial_allowed: { type: [boolean, "null"] }
    Agreement:
      allOf:
        - $ref: "#/components/schemas/AgreementInput"
        - type: object
          properties:
            id: { type: string, format: uuid }
            file_name: { type: [string, "null"] }
            review_status: { type: string }
            products_count: { type: integer }
    Analysis:
      type: object
      properties:
        id: { type: string, format: uuid }
        agreement_id: { type: string, format: uuid }
        model: { type: string }
        prompt_version: { type: string }
        status: { type: string, enum: [DRAFT, APPROVED] }
        paragraphs: { type: array, items: { type: string } }
        similar_agreements:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              license_type: { type: string }
              cost_model: { type: string }
              similarity: { type: number }
        result:
          type: object
          properties:
            license_type: { type: [string, "null"] }
            cost_model: { type: [string, "null"] }
            commercial_use:
              type: object
              properties:
                value: { type: string, enum: [YES, NO, UNDEFINED] }
                paragraphs: { type: array, items: { type: integer } }
                quote: { type: string }
            subscriptions: { type: array, items: { type: object } }
            restrictions: { type: array, items: { type: object } }
            risks: { type: array, items: { type: object } }
            summary: { type: string }
    ContractInput:
      type: object
      properties:
        product_id: { type: string, format: uuid }
        agreement_id: { type: [string, "null"], format: uuid }
        license_metric: { type: string, enum: [PER_DEVICE, UNLIMITED, CONCURRENT, UNKNOWN], default: PER_DEVICE }
        quantity: { type: integer, minimum: 0 }
        valid_from: { type: [string, "null"], format: date }
        expires_at: { type: [string, "null"], format: date }
        purchase_reference: { type: [string, "null"], description: "номер договора" }
    Dashboard:
      type: object
      properties:
        devices: { type: integer }
        new_devices: { type: integer }
        installations: { type: integer }
        recognized_installations: { type: integer }
        recognized_percent: { type: number }
        pending_review: { type: integer }
        license_deficit: { type: object, properties: { products: { type: integer }, seats: { type: integer } } }
        idle_licenses: { type: object, properties: { products: { type: integer }, seats: { type: integer } } }
        forbidden_software: { type: object, properties: { installations: { type: integer }, devices: { type: integer } } }
        outdated_software: { type: object, properties: { installations: { type: integer }, devices: { type: integer } } }
        expiring_contracts: { type: integer }
        expiring_within_days: { type: integer }
    MatchingSettings:
      type: object
      properties:
        auto_apply_confidence: { type: number }
        fuzzy_auto_threshold: { type: number }
