openapi: 3.1.0
info:
  title: SAM Platform API
  version: 1.0.0
  description: |
    Публичный REST API за nginx. Все ручки, кроме health, требуют `Authorization: Bearer <JWT>`.
    Роли: EMPLOYEE, ADMIN, IT_DIRECTOR. Доступ проверяется в сервисах; для EMPLOYEE данные
    ограничены собственными устройствами, цены и лицензии скрыты.

    В Swagger нажмите Authorize и вставьте JWT без префикса Bearer. Затем откройте операцию,
    выберите Try it out, заполните параметры и нажмите Execute. Токены выдаёт внешний IdP;
    отдельного endpoint для входа в этом API нет. 401 означает отсутствие или невалидность JWT,
    403 — недостаточную роль; некоторые чужие объекты скрываются ответом 404.

    Основной сценарий: загрузить CSV → проверить статус импорта → разобрать задачи matching →
    зарегистрировать лицензии → посмотреть баланс и нарушения. Для сотрудника начните с
    GET /api/v1/me/devices. Пустой items означает отсутствие доступных записей.

    Списки с пагинацией возвращают items и pagination; page начинается с 1, limit по умолчанию 50,
    максимум 200. Идентификаторы в путях — UUID соответствующих записей.
servers:
  - url: /
security:
  - bearer: []

tags:
  - name: imports
    description: Приём CSV и отчётов агентов, контроль прогресса и повторная обработка инвентаризации.
  - name: devices
    description: Реестр компьютеров, назначение сотрудникам, установленные программы и нарушения на устройстве.
  - name: employees
    description: Карточки сотрудников и просмотр связанных устройств и установок ПО.
  - name: software
    description: Нормализованный каталог ПО, версии, политики и правила распознавания исходных названий.
  - name: licenses
    description: Учёт приобретённых лицензионных прав и сравнение их количества с потреблением.
  - name: agreements
    description: Тексты лицензионных соглашений, условия использования и AI-анализ с проверкой администратором.
  - name: compliance
    description: Находки о нарушениях, их рассмотрение, сводки и детерминированный пересчёт.
  - name: analytics
    description: Агрегированные показатели для дашбордов по ПО, лицензиям, нарушениям и подразделениям.
  - name: matching
    description: Ручная проверка неоднозначного ПО и привязка исходных записей к каталогу.
  - name: chat
    description: Личные диалоги с AI-ассистентом, история сообщений и получение ответа через SSE.

paths:
  /api/v1/imports:
    post:
      summary: "Загрузить CSV с установленным ПО"
      description: |
        Загружает инвентаризацию нескольких компьютеров и запускает фоновый разбор, сопоставление ПО и пересчёт нарушений. Ответ 202 означает приём файла, а не завершение обработки; опрашивайте GET /api/v1/imports/{id}. Лимит файла — 50 МБ. Обязательные колонки: COMPUTERS.SERIAL_NUMBER, SOFTWARE.DISPLAYNAME; поддерживаются SOFTWARE.PUBLISHER и SOFTWARE.VERSION, разделители запятая и точка с запятой.

        Доступ: ADMIN.
      tags: [imports]
      parameters:
        - name: collected_at
          in: query
          schema: { type: string, format: date-time }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                collected_at: { type: string, format: date-time }
      responses:
        "202": { $ref: "#/components/responses/Accepted" }
        "400": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
    get:
      summary: "Посмотреть историю импортов"
      description: |
        Возвращает страницу импортов CSV и отчётов агентов с прогрессом обработки. Используется для журнала загрузок и поиска неуспешных импортов.

        Доступ: ADMIN.
      tags: [imports]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportPage" }
  /api/v1/imports/{id}:
    get:
      summary: "Проверить прогресс конкретного импорта"
      description: |
        Возвращает состояние импорта, число обработанных, ожидающих и неуспешных снимков устройств. Используйте после загрузки, пока статус не станет COMPLETED, COMPLETED_WITH_ERRORS или FAILED.

        Доступ: ADMIN, INVENTORY_AGENT.
      tags: [imports]
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Import" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/imports/{id}/errors:
    get:
      summary: "Разобрать ошибки CSV"
      description: |
        Возвращает страницу сохранённых ошибок с номерами строк и причинами. Помогает исправить исходный файл; сохраняется не более 1000 ошибок строк.

        Доступ: ADMIN.
      tags: [imports]
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200": { $ref: "#/components/responses/Page" }
  /api/v1/imports/{id}/retry:
    post:
      summary: "Повторить неуспешную обработку импорта"
      description: |
        Повторно ставит в очередь неуспешные и неопубликованные снимки. Если снимков ещё нет, повторно разбирает сохранённый CSV; без исходного файла возвращает 409. Статус проверяйте отдельным GET-запросом.

        Доступ: ADMIN.
      tags: [imports]
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Import" }
  /api/v1/agent/inventory:
    post:
      summary: "Принять инвентаризацию одного компьютера"
      description: |
        Альтернатива CSV для автоматического агента. Принимает серийный номер и список ПО, создаёт импорт и асинхронно обрабатывает снимок. FULL означает полный список: отсутствующее ПО деактивируется; PARTIAL только добавляет или обновляет переданные установки. При отсутствии collected_at используется текущее время; время более чем на 5 минут в будущем отклоняется.

        Доступ: ADMIN, INVENTORY_AGENT.
      tags: [imports]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [serial_number, software]
              properties:
                serial_number: { type: string }
                collected_at: { type: string, format: date-time }
                snapshot_type: { type: string, enum: [FULL, PARTIAL] }
                software:
                  type: array
                  items:
                    type: object
                    required: [display_name]
                    properties:
                      display_name: { type: string }
                      publisher: { type: string }
                      version: { type: string }
      responses:
        "202": { $ref: "#/components/responses/Accepted" }

  /api/v1/me/devices:
    get:
      summary: "Получить свои устройства"
      description: |
        Возвращает устройства, связанные с employee_id текущего JWT. Используйте в личном кабинете сотрудника. Если в токене нет корректного employee_id или устройств нет, список пуст. Для общего реестра нужен GET /api/v1/devices с ролью ADMIN или IT_DIRECTOR.

        Доступ: EMPLOYEE, ADMIN, IT_DIRECTOR.
      tags: [devices]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200": { $ref: "#/components/responses/Page" }
  /api/v1/devices:
    get:
      summary: "Найти устройства в общем реестре"
      description: |
        Возвращает страницу устройств организации. Поддерживает поиск и фильтры по серийному номеру, отделу, сотруднику и наличию нарушений. EMPLOYEE получает 403; для него предусмотрен GET /api/v1/me/devices.

        Доступ: ADMIN, IT_DIRECTOR.
      tags: [devices]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - { name: search, in: query, schema: { type: string } }
        - { name: serial_number, in: query, schema: { type: string } }
        - { name: department, in: query, schema: { type: string } }
        - { name: employee_id, in: query, schema: { type: string, format: uuid } }
        - { name: has_violations, in: query, schema: { type: boolean } }
      responses:
        "200": { $ref: "#/components/responses/Page" }
  /api/v1/devices/{id}:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      summary: "Открыть карточку устройства"
      description: |
        Возвращает сведения об устройстве и его назначении сотруднику. Сотрудник может открыть только своё устройство; чужое скрывается ответом 404.

        Доступ: EMPLOYEE, ADMIN, IT_DIRECTOR.
      tags: [devices]
      responses:
        "200": { $ref: "#/components/responses/Object" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      summary: "Изменить сведения и владельца устройства"
      description: |
        Обновляет hostname, operating_system и привязку к сотруднику. employee_id: null снимает назначение. Смена сотрудника пересчитывает комплаенс затронутых продуктов, в том числе потребление лицензий PER_USER. Установки ПО этим запросом не изменяются.

        Доступ: ADMIN.
      tags: [devices]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                hostname: { type: string }
                operating_system: { type: string }
                employee_id: { type: [string, "null"], format: uuid }
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /api/v1/devices/{id}/software:
    get:
      summary: "Посмотреть ПО на устройстве"
      description: |
        Возвращает страницу установок и результатов сопоставления с каталогом. include_removed=true включает удалённые установки. Сотруднику доступно только собственное устройство.

        Доступ: EMPLOYEE, ADMIN, IT_DIRECTOR.
      tags: [devices]
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - { name: include_removed, in: query, schema: { type: boolean } }
      responses:
        "200": { $ref: "#/components/responses/Page" }
  /api/v1/devices/{id}/compliance:
    get:
      summary: "Посмотреть нарушения на устройстве"
      description: |
        Возвращает страницу находок комплаенса для выбранного устройства. Сотрудник видит только своё устройство и разрешённые ему сведения об установках.

        Доступ: EMPLOYEE, ADMIN, IT_DIRECTOR.
      tags: [devices]
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200": { $ref: "#/components/responses/Page" }

  /api/v1/employees:
    get:
      summary: "Найти сотрудников"
      description: |
        Возвращает страницу сотрудников с поиском и фильтром по отделу. Используется для выбора владельца компьютера и просмотра распределения ПО по людям.

        Доступ: ADMIN, IT_DIRECTOR.
      tags: [employees]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - { name: search, in: query, schema: { type: string } }
        - { name: department, in: query, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/Page" }
  /api/v1/employees/{id}:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      summary: "Открыть карточку сотрудника"
      description: |
        Возвращает имя, отдел, должность, контакты и состояние учётной записи сотрудника.

        Доступ: ADMIN, IT_DIRECTOR.
      tags: [employees]
      responses:
        "200": { $ref: "#/components/responses/Object" }
    patch:
      summary: "Обновить карточку сотрудника"
      description: |
        Изменяет имя, отдел, должность, email или признак активности. Не создаёт сотрудника и не назначает ему устройство: назначение выполняется через PATCH /api/v1/devices/{id}.

        Доступ: ADMIN.
      tags: [employees]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                full_name: { type: string }
                department: { type: string }
                position: { type: string }
                email: { type: string }
                is_active: { type: boolean }
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /api/v1/employees/{id}/devices:
    get:
      summary: "Посмотреть устройства сотрудника"
      description: |
        Возвращает страницу компьютеров, назначенных указанному сотруднику. Используется для учёта оборудования и проверки привязок.

        Доступ: ADMIN, IT_DIRECTOR.
      tags: [employees]
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200": { $ref: "#/components/responses/Page" }
  /api/v1/employees/{id}/software:
    get:
      summary: "Посмотреть установки ПО сотрудника"
      description: |
        Возвращает страницу установок на устройствах указанного сотрудника. Это список установок, поэтому один продукт может встречаться на нескольких компьютерах.

        Доступ: ADMIN, IT_DIRECTOR.
      tags: [employees]
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200": { $ref: "#/components/responses/Page" }

  /api/v1/software:
    get:
      summary: "Найти продукт в каталоге ПО"
      description: |
        Возвращает страницу нормализованных продуктов. Поддерживает поиск, фильтр политики использования и include_archived для архивных записей. Сотруднику возвращается публичное представление без сведений о соглашении.

        Доступ: EMPLOYEE, ADMIN, IT_DIRECTOR.
      tags: [software]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - { name: search, in: query, schema: { type: string } }
        - { name: policy_status, in: query, schema: { $ref: "#/components/schemas/PolicyStatus" } }
        - { name: include_archived, in: query, schema: { type: boolean } }
      responses:
        "200": { $ref: "#/components/responses/Page" }
    post:
      summary: "Добавить продукт в каталог"
      description: |
        Создаёт нормализованную карточку ПО для последующего сопоставления установок и учёта лицензий. canonical_name обязателен; можно указать издателя, редакцию, соглашение и политику. Без policy_status используется UNKNOWN. Само добавление продукта не регистрирует установку или покупку лицензии.

        Доступ: ADMIN.
      tags: [software]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [canonical_name]
              properties:
                canonical_name: { type: string }
                publisher: { type: string }
                edition: { type: string }
                agreement_id: { type: string, format: uuid }
                policy_status: { $ref: "#/components/schemas/PolicyStatus" }
                description: { type: string }
      responses:
        "201": { $ref: "#/components/responses/Object" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/software/{id}:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      summary: "Открыть карточку продукта"
      description: |
        Возвращает нормализованное название, издателя, редакцию и политику использования продукта. Для сотрудника сведения о соглашении скрыты.

        Доступ: EMPLOYEE, ADMIN, IT_DIRECTOR.
      tags: [software]
      responses:
        "200": { $ref: "#/components/responses/Object" }
    patch:
      summary: "Изменить карточку или архивировать продукт"
      description: |
        Частично обновляет поля продукта и пересчитывает связанные нарушения. archived=true архивирует запись, agreement_id: null снимает связь с соглашением. История установок не удаляется.

        Доступ: ADMIN.
      tags: [software]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                canonical_name: { type: string }
                publisher: { type: string }
                edition: { type: string }
                agreement_id: { type: [string, "null"], format: uuid }
                policy_status: { $ref: "#/components/schemas/PolicyStatus" }
                description: { type: string }
                archived: { type: boolean }
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /api/v1/software/{id}/policy:
    patch:
      summary: "Изменить политику использования ПО"
      description: |
        Устанавливает ALLOWED, RESTRICTED, FORBIDDEN или UNKNOWN и пересчитывает комплаенс продукта. Используйте, например, чтобы отметить запрещённое ПО и получить находки FORBIDDEN_SOFTWARE на установках.

        Доступ: ADMIN.
      tags: [software]
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [policy_status]
              properties:
                policy_status: { $ref: "#/components/schemas/PolicyStatus" }
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /api/v1/software/{id}/versions:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      summary: "Посмотреть версии продукта"
      description: |
        Возвращает версии из каталога с состоянием поддержки и датами выпуска или окончания поддержки. Это справочник версий, а не перечень установок.

        Доступ: EMPLOYEE, ADMIN, IT_DIRECTOR.
      tags: [software]
      responses:
        "200": { $ref: "#/components/responses/List" }
    post:
      summary: "Добавить версию продукта"
      description: |
        Регистрирует версию и её lifecycle_status, даты выпуска и окончания поддержки. Без статуса используется UNKNOWN. Для уже существующей версии статус меняется отдельным PATCH-запросом.

        Доступ: ADMIN.
      tags: [software]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: string }
                lifecycle_status: { $ref: "#/components/schemas/Lifecycle" }
                release_date: { type: string, format: date }
                end_of_support: { type: string, format: date }
      responses:
        "201": { $ref: "#/components/responses/Object" }
  /api/v1/software/{id}/versions/{versionID}:
    patch:
      summary: "Изменить состояние поддержки версии"
      description: |
        Меняет lifecycle_status на CURRENT, OUTDATED, UNSUPPORTED или UNKNOWN и пересчитывает нарушения продукта. Используйте для отметки устаревших или неподдерживаемых версий.

        Доступ: ADMIN.
      tags: [software]
      parameters:
        - $ref: "#/components/parameters/ID"
        - { name: versionID, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lifecycle_status]
              properties:
                lifecycle_status: { $ref: "#/components/schemas/Lifecycle" }
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /api/v1/software/{id}/aliases:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      summary: "Посмотреть правила сопоставления названий"
      description: |
        Возвращает aliases: соответствия исходных названий, издателей и версий конкретному продукту. Помогает понять, почему строка инвентаризации была распознана именно так.

        Доступ: ADMIN, IT_DIRECTOR.
      tags: [software]
      responses:
        "200": { $ref: "#/components/responses/List" }
    post:
      summary: "Связать исходное название с продуктом"
      description: |
        Создаёт или обновляет alias по комбинации raw_name, raw_publisher и raw_version. Переназначает соответствующие установки, подтверждает связанные задачи matching и пересчитывает комплаенс. Можно явно указать version_id этого продукта.

        Доступ: ADMIN.
      tags: [software]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [raw_name]
              properties:
                raw_name: { type: string }
                raw_publisher: { type: string }
                raw_version: { type: string }
                version_id: { type: string, format: uuid }
      responses:
        "201": { $ref: "#/components/responses/Object" }
  /api/v1/software/{id}/aliases/{aliasID}:
    delete:
      summary: "Удалить ошибочное правило сопоставления"
      description: |
        Удаляет alias и снимает сопоставление с соответствующих установок, переводя их в REQUIRES_REVIEW. Пересчитывает нарушения; сами установки сохраняются. Успешный ответ 204 не содержит тела.

        Доступ: ADMIN.
      tags: [software]
      parameters:
        - $ref: "#/components/parameters/ID"
        - { name: aliasID, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Deleted }
  /api/v1/software/{id}/installations:
    get:
      summary: "Найти установки конкретного продукта"
      description: |
        Возвращает страницу активных установок продукта по устройствам. Используется, чтобы найти компьютеры с конкретной программой и проверить её распространение.

        Доступ: ADMIN, IT_DIRECTOR.
      tags: [software]
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200": { $ref: "#/components/responses/Page" }
  /api/v1/software/{id}/license-balance:
    get:
      summary: "Проверить баланс лицензий продукта"
      description: |
        Сравнивает действующие лицензионные права с потреблением выбранного продукта. Возвращает купленное количество, потребление, доступный остаток, дефицит и статус достоверности расчёта. CONCURRENT нельзя проверить по установкам; разные метрики не суммируются.

        Доступ: ADMIN, IT_DIRECTOR.
      tags: [software]
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200": { $ref: "#/components/responses/List" }

  /api/v1/licenses:
    get:
      summary: "Посмотреть зарегистрированные лицензии"
      description: |
        Возвращает страницу лицензионных прав с количеством, метрикой, сроками и стоимостью. Можно отфильтровать по product_id; active=true ограничивает выборку активными записями.

        Доступ: ADMIN, IT_DIRECTOR.
      tags: [licenses]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - { name: product_id, in: query, schema: { type: string, format: uuid } }
        - { name: active, in: query, schema: { type: boolean } }
      responses:
        "200": { $ref: "#/components/responses/Page" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      summary: "Зарегистрировать покупку лицензий"
      description: |
        Создаёт лицензионное право на продукт с метрикой и количеством, при необходимости со сроками, ценой и ссылкой на покупку. Пересчитывает нарушения продукта. Не устанавливает ПО и не выдаёт JWT.

        Доступ: ADMIN.
      tags: [licenses]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LicenseInput" }
      responses:
        "201": { $ref: "#/components/responses/Object" }
  /api/v1/licenses/balance:
    get:
      summary: "Проверить общий баланс лицензий"
      description: |
        Сравнивает лицензионные права с активными установками по продуктам; product_id ограничивает расчёт одним продуктом. PER_DEVICE считает устройства, PER_USER — сотрудников; CONCURRENT и UNKNOWN требуют иной информации и помечаются как непроверенные.

        Доступ: ADMIN, IT_DIRECTOR.
      tags: [licenses]
      parameters:
        - { name: product_id, in: query, schema: { type: string, format: uuid } }
      responses:
        "200": { $ref: "#/components/responses/List" }
  /api/v1/licenses/{id}:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      summary: "Открыть запись о лицензии"
      description: |
        Возвращает одну запись о лицензионных правах: продукт, соглашение, метрику, количество, сроки и финансовые поля. id — UUID записи лицензии, а не продукта.

        Доступ: ADMIN, IT_DIRECTOR.
      tags: [licenses]
      responses:
        "200": { $ref: "#/components/responses/Object" }
    patch:
      summary: "Исправить параметры лицензии"
      description: |
        Частично изменяет количество, метрику, сроки, стоимость и другие поддерживаемые поля записи. Nullable-поля можно очистить через null. После изменения пересчитывается комплаенс затронутых продуктов.

        Доступ: ADMIN.
      tags: [licenses]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LicenseInput" }
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /api/v1/licenses/{id}/deactivate:
    post:
      summary: "Исключить лицензию из расчёта"
      description: |
        Деактивирует лицензионное право без удаления истории и пересчитывает комплаенс продукта. Используется для отменённой или ошибочно зарегистрированной покупки; может привести к появлению дефицита.

        Доступ: ADMIN.
      tags: [licenses]
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200": { $ref: "#/components/responses/Object" }

  /api/v1/agreements:
    get:
      summary: "Посмотреть реестр лицензионных соглашений"
      description: |
        Возвращает страницу соглашений с типом лицензии и условиями использования. Полный agreement_text в списке не возвращается; для него откройте карточку соглашения.

        Доступ: ADMIN, IT_DIRECTOR.
      tags: [agreements]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200": { $ref: "#/components/responses/Page" }
    post:
      summary: "Добавить лицензионное соглашение"
      description: |
        Создаёт соглашение с названием, типом лицензии, текстом, ссылкой на источник и разрешением коммерческого использования. Для AI-анализа нужен непустой agreement_text. Привязка к продукту выполняется через карточку продукта.

        Доступ: ADMIN.
      tags: [agreements]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgreementInput" }
      responses:
        "201": { $ref: "#/components/responses/Object" }
  /api/v1/agreements/{id}:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      summary: "Прочитать соглашение и условия"
      description: |
        Возвращает карточку соглашения, включая сохранённый текст и условия коммерческого использования. Используется для ручной проверки перед привязкой к ПО или подтверждением анализа.

        Доступ: ADMIN, IT_DIRECTOR.
      tags: [agreements]
      responses:
        "200": { $ref: "#/components/responses/Object" }
    patch:
      summary: "Изменить условия соглашения"
      description: |
        Обновляет текст, тип лицензии, commercial_allowed, ссылку и статус проверки. Пересчитывает комплаенс связанных продуктов. Для применения выводов AI к фактическим условиям используйте этот запрос после проверки анализа.

        Доступ: ADMIN.
      tags: [agreements]
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/AgreementInput"
                - type: object
                  properties:
                    review_status: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /api/v1/agreements/{id}/analyze:
    post:
      summary: "Проанализировать текст соглашения с AI"
      description: |
        Получает сохранённый текст соглашения и запрашивает структурированный анализ условий у LLM. Без force переиспользует последний анализ с тем же хэшем текста; force=true запускает анализ повторно. Сохраняет предложение для проверки человеком, но не меняет условия соглашения. Без текста — 400, при недоступном провайдере возможен 503; в mock-режиме результат демонстрационный.

        Доступ: ADMIN.
      tags: [agreements]
      parameters:
        - $ref: "#/components/parameters/ID"
        - { name: force, in: query, schema: { type: boolean } }
      responses:
        "200": { $ref: "#/components/responses/Object" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/agreements/{id}/analysis:
    get:
      summary: "Посмотреть последний AI-анализ"
      description: |
        Возвращает последний сохранённый анализ с моделью, версией промпта и статусом проверки. Новый анализ не запускается; если результатов ещё нет, возвращает 404.

        Доступ: ADMIN, IT_DIRECTOR.
      tags: [agreements]
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200": { $ref: "#/components/responses/Object" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/agreements/{id}/analysis/approve:
    post:
      summary: "Подтвердить проверку AI-анализа"
      description: |
        Отмечает последний анализ как APPROVED, записывает проверившего пользователя и переводит review_status соглашения в ANALYSIS_APPROVED. Самостоятельно не переносит выводы AI в license_type или commercial_allowed: эти поля администратор меняет через PATCH соглашения.

        Доступ: ADMIN.
      tags: [agreements]
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200": { $ref: "#/components/responses/Object" }

  /api/v1/compliance/findings:
    get:
      summary: "Найти нарушения и риски"
      description: |
        Возвращает страницу находок с фильтрами по типам через запятую, критичности, статусу, устройству и продукту. Сотрудник видит только разрешённые находки по своим устройствам, без общих лицензионных и финансовых сведений.

        Доступ: EMPLOYEE, ADMIN, IT_DIRECTOR.
      tags: [compliance]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - name: type
          in: query
          description: Один или несколько типов через запятую
          schema: { type: string }
        - { name: severity, in: query, schema: { type: string, enum: [LOW, MEDIUM, HIGH, CRITICAL] } }
        - { name: status, in: query, schema: { type: string, enum: [OPEN, ACKNOWLEDGED, RESOLVED] } }
        - { name: device_id, in: query, schema: { type: string, format: uuid } }
        - { name: product_id, in: query, schema: { type: string, format: uuid } }
      responses:
        "200": { $ref: "#/components/responses/Page" }
  /api/v1/compliance/findings/{id}:
    get:
      summary: "Посмотреть детали нарушения"
      description: |
        Возвращает причину, тип, критичность и состояние конкретной находки. Для сотрудника недоступные находки скрываются ответом 404, а details ограничен публичными полями.

        Доступ: EMPLOYEE, ADMIN, IT_DIRECTOR.
      tags: [compliance]
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /api/v1/compliance/findings/{id}/acknowledge:
    post:
      summary: "Отметить нарушение как рассмотренное"
      description: |
        Фиксирует, что администратор ознакомился с находкой, и переводит её в ACKNOWLEDGED. Это не устраняет причину нарушения; RESOLVED выставляется при пересчёте, когда причина исчезла.

        Доступ: ADMIN.
      tags: [compliance]
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /api/v1/compliance/summary:
    get:
      summary: "Получить сводку нарушений"
      description: |
        Возвращает счётчики открытых и рассмотренных находок, разбивку по критичности и типам. Сотруднику сводка ограничивается его устройствами и доступными типами нарушений.

        Доступ: EMPLOYEE, ADMIN, IT_DIRECTOR.
      tags: [compliance]
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /api/v1/compliance/recalculate:
    post:
      summary: "Пересчитать все нарушения"
      description: |
        Синхронно запускает детерминированные проверки по текущим установкам, политикам, версиям и лицензиям. Обновляет существующие находки, создаёт новые и закрывает исчезнувшие. LLM в расчёте не участвует; ответ status=recalculated означает завершение расчёта.

        Доступ: ADMIN.
      tags: [compliance]
      responses:
        "200": { $ref: "#/components/responses/Object" }

  /api/v1/analytics/dashboard:
    get:
      summary: "Получить показатели главного дашборда"
      description: |
        Возвращает сводные показатели инвентаря и комплаенса. Для ADMIN и IT_DIRECTOR добавляет лицензионные показатели; для EMPLOYEE ограничивает данные собственными устройствами, без лицензий и стоимости. Сотрудник без employee_id получает 403.

        Доступ: EMPLOYEE, ADMIN, IT_DIRECTOR.
      tags: [analytics]
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /api/v1/analytics/software:
    get:
      summary: "Посмотреть распространённость ПО"
      description: |
        Возвращает агрегированную статистику использования продуктов для диаграмм и рейтингов. limit задаёт размер выборки: по умолчанию 20, максимум 200.

        Доступ: ADMIN, IT_DIRECTOR.
      tags: [analytics]
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 20, minimum: 1, maximum: 200 } }
      responses:
        "200": { $ref: "#/components/responses/List" }
  /api/v1/analytics/licenses:
    get:
      summary: "Получить лицензионную аналитику"
      description: |
        Возвращает тот же расчёт балансов, что GET /api/v1/licenses/balance, для лицензионного раздела дашборда. Показывает потребление, остаток, дефицит и достоверность расчёта; поддерживает product_id.

        Доступ: ADMIN, IT_DIRECTOR.
      tags: [analytics]
      responses:
        "200": { $ref: "#/components/responses/List" }
  /api/v1/analytics/compliance:
    get:
      summary: "Получить показатели комплаенса для аналитики"
      description: |
        Возвращает ту же ролевую сводку, что GET /api/v1/compliance/summary. Используется для счётчиков и диаграмм; новых проверок не запускает.

        Доступ: EMPLOYEE, ADMIN, IT_DIRECTOR.
      tags: [analytics]
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /api/v1/analytics/departments:
    get:
      summary: "Сравнить отделы по инвентарю"
      description: |
        Возвращает агрегированную статистику по подразделениям для сравнения распределения устройств и установок. Индивидуальный сотрудник не имеет доступа к этой сводке.

        Доступ: ADMIN, IT_DIRECTOR.
      tags: [analytics]
      responses:
        "200": { $ref: "#/components/responses/List" }

  /api/v1/matching/pending:
    get:
      summary: "Посмотреть очередь ручного сопоставления ПО"
      description: |
        Возвращает страницу задач, где исходное название ПО требует решения человека. По умолчанию status=PENDING; можно посмотреть APPROVED и REJECTED. В ответ добавляются карточки предложенных продуктов. IT_DIRECTOR может читать задачи, но не подтверждать их.

        Доступ: ADMIN, IT_DIRECTOR.
      tags: [matching]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - { name: status, in: query, schema: { type: string, enum: [PENDING, APPROVED, REJECTED], default: PENDING } }
      responses:
        "200": { $ref: "#/components/responses/Page" }
  /api/v1/matching/{id}:
    get:
      summary: "Разобрать задачу сопоставления"
      description: |
        Возвращает исходное название, издателя, версию, кандидатов и состояние проверки. Используется для выбора правильного продукта перед approve либо для изучения причины неоднозначности.

        Доступ: ADMIN, IT_DIRECTOR.
      tags: [matching]
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /api/v1/matching/{id}/approve:
    post:
      summary: "Подтвердить соответствие продукту"
      description: |
        Принимает product_id и необязательный version_id, создаёт alias, переназначает связанные установки и пересчитывает комплаенс. Задача должна быть PENDING, иначе 409. version_id должен относиться к выбранному продукту.

        Доступ: ADMIN.
      tags: [matching]
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product_id]
              properties:
                product_id: { type: string, format: uuid }
                version_id: { type: string, format: uuid }
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /api/v1/matching/{id}/reject:
    post:
      summary: "Отклонить предложенное сопоставление"
      description: |
        Закрывает PENDING-задачу как REJECTED с необязательной причиной. При отсутствии подтверждённого alias снимает сопоставление установок, оставляя ПО неизвестным, и пересчитывает находки. Повторное решение по уже проверенной задаче возвращает 409.

        Доступ: ADMIN.
      tags: [matching]
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Object" }

  /api/v1/chat/conversations:
    get:
      summary: "Посмотреть свои диалоги с ассистентом"
      description: |
        Возвращает страницу диалогов текущего пользователя. Чужие диалоги не показываются. Открытие диалога также требует совпадения текущей роли с ролью при его создании.

        Доступ: EMPLOYEE, ADMIN, IT_DIRECTOR.
      tags: [chat]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200": { $ref: "#/components/responses/Page" }
    post:
      summary: "Создать диалог с AI-ассистентом"
      description: |
        Создаёт пустой диалог, закреплённый за пользователем и его текущей ролью. title необязателен. Для получения ответа отправьте сообщение отдельным POST-запросом на /messages.

        Доступ: EMPLOYEE, ADMIN, IT_DIRECTOR.
      tags: [chat]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
      responses:
        "201": { $ref: "#/components/responses/Object" }
  /api/v1/chat/conversations/{id}:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      summary: "Открыть свой диалог"
      description: |
        Возвращает сведения о диалоге текущего пользователя. Чужой диалог даёт 404, смена роли относительно момента создания — 403. История сообщений загружается отдельным запросом.

        Доступ: EMPLOYEE, ADMIN, IT_DIRECTOR.
      tags: [chat]
      responses:
        "200": { $ref: "#/components/responses/Object" }
    delete:
      summary: "Удалить свой диалог"
      description: |
        Удаляет принадлежащий пользователю диалог вместе с сообщениями. Требуется та же роль, с которой он был создан. Успешный ответ 204 не содержит тела.

        Доступ: EMPLOYEE, ADMIN, IT_DIRECTOR.
      tags: [chat]
      responses:
        "204": { description: Deleted }
  /api/v1/chat/conversations/{id}/messages:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      summary: "Загрузить историю сообщений"
      description: |
        Возвращает страницу сохранённых сообщений собственного диалога. Показывает ответы ассистента и их статусы, в том числе incomplete при прерванном ответе. Не запускает генерацию.

        Доступ: EMPLOYEE, ADMIN, IT_DIRECTOR.
      tags: [chat]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200": { $ref: "#/components/responses/Page" }
    post:
      summary: "Отправить сообщение и получить SSE-ответ"
      description: |
        Сохраняет сообщение пользователя, вызывает ассистента с доступными роли инструментами и передаёт ответ как text/event-stream. События: message_start с message_id, delta с content, message_end с message_id и status, error с code и message. Разрешён один активный запрос на пользователя, иначе 429. content обязателен, до 4000 символов; в mock-режиме ответы демонстрационные. Для потокового клиента используйте SSE или curl -N.

        Доступ: EMPLOYEE, ADMIN, IT_DIRECTOR.
      tags: [chat]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string, maxLength: 4000 }
      responses:
        "200":
          description: SSE stream
          content:
            text/event-stream:
              schema: { type: string }
        "429": { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }

  responses:
    Object:
      description: OK
      content:
        application/json:
          schema: { type: object }
    List:
      description: OK
      content:
        application/json:
          schema:
            type: array
            items: { type: object }
    Page:
      description: OK
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Page" }
    Accepted:
      description: Accepted
      content:
        application/json:
          schema:
            type: object
            properties:
              import_id: { type: string, format: uuid }
              status: { type: string }
              filename: { type: string }
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string, examples: [invalid_argument, not_found, forbidden] }
            message: { type: string }
            request_id: { type: string }
    Pagination:
      type: object
      properties:
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
        total_pages: { type: integer }
    Page:
      type: object
      properties:
        items:
          type: array
          items: { type: object }
        pagination: { $ref: "#/components/schemas/Pagination" }
    ImportPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Import" }
        pagination: { $ref: "#/components/schemas/Pagination" }
    Import:
      type: object
      properties:
        id: { type: string, format: uuid }
        filename: { type: string }
        source: { type: string, enum: [CSV, AGENT] }
        status:
          type: string
          enum: [PENDING, PARSING, PROCESSING, COMPLETED, COMPLETED_WITH_ERRORS, FAILED]
        file_size: { type: integer }
        total_rows: { type: integer }
        total_devices: { type: integer }
        processed_devices: { type: integer }
        failed_devices: { type: integer }
        pending_devices: { type: integer }
        progress_percent: { type: number }
        created_by: { type: string }
        collected_at: { type: string, format: date-time }
        error_message: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        completed_at: { type: [string, "null"], format: date-time }
    PolicyStatus:
      type: string
      enum: [ALLOWED, RESTRICTED, FORBIDDEN, UNKNOWN]
    Lifecycle:
      type: string
      enum: [CURRENT, OUTDATED, UNSUPPORTED, UNKNOWN]
    LicenseInput:
      type: object
      properties:
        product_id: { type: string, format: uuid }
        agreement_id: { type: [string, "null"], format: uuid }
        license_metric: { type: string, enum: [PER_DEVICE, PER_USER, UNLIMITED, CONCURRENT, UNKNOWN] }
        quantity: { type: integer, minimum: 0 }
        unit_price: { type: [number, "null"] }
        currency: { type: [string, "null"] }
        valid_from: { type: [string, "null"], format: date }
        expires_at: { type: [string, "null"], format: date }
        purchase_reference: { type: [string, "null"] }
    AgreementInput:
      type: object
      properties:
        name: { type: string }
        license_type: { type: string, enum: [COMMERCIAL, FREEWARE, OPEN_SOURCE, TRIAL, PROPRIETARY, UNKNOWN] }
        agreement_text: { type: [string, "null"] }
        source_url: { type: [string, "null"] }
        commercial_allowed: { type: [boolean, "null"] }
