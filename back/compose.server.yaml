# Behind the existing host nginx; port 8080 is occupied by Apache.
# docker compose -f compose.yaml -f compose.server.yaml up -d --build
services:
  llm:
    volumes:
      - ./secrets/russian_trusted_root_ca.pem:/secrets/russian_trusted_root_ca.pem:ro
  nginx:
    ports: !override
      - "127.0.0.1:8443:443"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
    volumes: !override
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/snippets:/etc/nginx/snippets:ro
      - ./deploy/nginx/sites/backend.conf.template:/etc/nginx/templates/default.conf.template:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./api:/srv/api:ro
