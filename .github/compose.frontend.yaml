# Paths are relative to back/compose.yaml (the first Compose file).
services:
  frontend:
    build:
      context: ../front
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:5173:80"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
