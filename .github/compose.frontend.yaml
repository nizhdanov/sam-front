# Standalone frontend deployment; paths are relative to this file.
services:
  frontend:
    build:
      context: ../front
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:5173:80"
    networks:
      - frontend
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  frontend:
    name: sam_frontend
