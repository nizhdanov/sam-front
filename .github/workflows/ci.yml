name: CI

on:
  push:
  pull_request:
  workflow_call:
    inputs:
      component:
        type: string
        default: all

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  backend:
    if: ${{ inputs.component != 'frontend' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: back
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: back/go.mod
          cache-dependency-path: back/go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race ./...

  deployment:
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(inputs.component == 'frontend' && '["frontend"]' || inputs.component == 'backend' && '["backend"]' || '["backend","frontend"]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: .github/scripts/go.mod
          cache: false
      - name: Check and compile the deployment tool
        working-directory: .github/scripts
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race ./...
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o /tmp/sam-release-tool ./release
      - name: Validate the actual Compose build plan
        run: |
          release_dir="$RUNNER_TEMP/sam-release"
          /tmp/sam-release-tool prepare --component "${{ matrix.component }}" \
            --release "${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --root /opt/sam-backend --output "$release_dir"
          test -s "$release_dir/bake.json"
          docker buildx bake --allow "fs.read=$GITHUB_WORKSPACE" --file "$release_dir/bake.json" --load --print > /dev/null
