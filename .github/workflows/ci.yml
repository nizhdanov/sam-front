name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

# The caller's workflow name keeps CD checks separate from automatic CI.
# A newer automatic CI run supersedes the previous one across all branches.
concurrency:
  group: ci-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: back
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: back/go.mod
          cache-dependency-path: back/go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race ./...

  deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: .github/scripts/go.mod
          cache: false
      - name: Check and compile the deployment tool
        working-directory: .github/scripts
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o /tmp/sam-release-tool ./release
      - name: Validate the actual Compose build plan
        run: |
          /tmp/sam-release-tool prepare \
            --release "${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --root /opt/sam-backend --output /tmp/sam-release
          docker buildx bake -f /tmp/sam-release/bake.json --print > /dev/null
