name: CD Backend

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sam-production-backend
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    with:
      component: backend

  build:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production
    outputs:
      release: ${{ steps.plan.outputs.release }}
      root: ${{ steps.plan.outputs.root }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: .github/scripts/go.mod
          cache: false
      - name: Compile the standalone deployment tool
        working-directory: .github/scripts
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o /tmp/sam-release-tool ./release
      - uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 2
      - name: Discover services and prepare release
        id: plan
        env:
          DEPLOY_ROOT: ${{ vars.DEPLOY_ROOT || '/opt/sam-backend' }}
          BACKEND_CONFIG: ${{ secrets.BACKEND_CONFIG }}
        run: |
          release="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          release_dir="$RUNNER_TEMP/sam-release"
          /tmp/sam-release-tool prepare --production --component backend \
            --release "$release" --root "$DEPLOY_ROOT" --output "$release_dir"
          cp /tmp/sam-release-tool "$release_dir/release-tool"
          echo "RELEASE_DIR=$release_dir" >> "$GITHUB_ENV"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "root=$DEPLOY_ROOT" >> "$GITHUB_OUTPUT"
      - name: Make GitHub cache runtime available to Buildx CLI
        uses: actions/github-script@v7
        with:
          script: |
            for (const name of [
              'ACTIONS_RUNTIME_TOKEN',
              'ACTIONS_RESULTS_URL',
              'ACTIONS_CACHE_URL',
              'ACTIONS_CACHE_SERVICE_V2'
            ]) {
              const value = process.env[name];
              if (value) {
                if (name === 'ACTIONS_RUNTIME_TOKEN') core.setSecret(value);
                core.exportVariable(name, value);
              }
            }
      - name: Build backend images (no registry)
        env:
          BACKEND_CONFIG: ${{ secrets.BACKEND_CONFIG }}
        run: |
          printf 'Building commit %s\n' "$GITHUB_SHA"
          bake_file="$RELEASE_DIR/bake.json"
          if [ ! -s "$bake_file" ]; then
            echo "::error::Generated Bake file is missing or empty: $bake_file"
            exit 1
          fi
          printf 'Using local Bake file: %s\n' "$bake_file"
          docker buildx bake --allow "fs.read=$GITHUB_WORKSPACE" --file "$bake_file" --load
      - name: Package images and runtime configuration
        run: /tmp/sam-release-tool pack --output "$RELEASE_DIR"
      - uses: actions/upload-artifact@v4
        with:
          name: production-backend-release
          path: |
            ${{ runner.temp }}/sam-release/release.tar
            ${{ runner.temp }}/sam-release/release-tool
          compression-level: 0
          retention-days: 3
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: production-backend-release
          path: ${{ runner.temp }}/sam-release
      - name: Deliver, deploy, verify and retain two successful releases
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST || '45.10.219.212' }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER || 'root' }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_ROOT: ${{ needs.build.outputs.root }}
          RELEASE_ID: ${{ needs.build.outputs.release }}
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          RELEASE_ARCHIVE: ${{ runner.temp }}/sam-release/release.tar
        run: |
          chmod 700 "$RUNNER_TEMP/sam-release/release-tool"
          "$RUNNER_TEMP/sam-release/release-tool" deliver --component backend
